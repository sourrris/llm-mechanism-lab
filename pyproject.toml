[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mechanism-lab"
version = "0.1.0"
description = "A proof-driven 14-day LLM mechanism forge"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
interpretability = [
  "transformer-lens>=2.0",
  "nnsight>=0.4",
  "matplotlib>=3.8",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
